[project]
name = "orchestrator"
version = "0.1.0"
description = "FastAPI Agent Orchestration Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "openai>=1.14.0",
    "google-genai>=0.1.0",
    "python-jose[cryptography]>=3.3.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.1.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
