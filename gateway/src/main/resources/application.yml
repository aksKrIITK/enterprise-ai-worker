server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: enterprise-ai-gateway
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:enterprise_ai_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration


gateway:
  security:
    jwt-secret: ${JWT_SECRET:super_secret_jwt_key_for_enterprise_ai_worker_gateway_2026_production_secure_min_32_chars}
    service-token-secret: ${SERVICE_TO_SERVICE_SECRET:super_secret_jwt_service_token_gateway_to_orchestrator_internal_communication}
  orchestrator:
    url: ${ORCHESTRATOR_URL:http://localhost:8000}
